name: lint:html

on:
  pull_request:
    paths:
      - '**.php'
      - '.markuplintrc.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lint-html.yml'

concurrency:
  group: lint-html-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Markuplint (PHP templates)
        run: npm run lint:html
